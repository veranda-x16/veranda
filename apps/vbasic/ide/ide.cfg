# VeraBASIC, the editor (DECISIONS V93): its own link, after VeraBASIC's
# main one (apps/vbasic/Makefile, target ide). The main link's symbols
# below $A000 come as equates (tools/vbceq.py), so the editor uses main
# RAM's cc65 runtime, C library and kernel bindings; what main RAM has not
# got is linked here into LOW.
#   LOW (records 12-14): the editor's main RAM part, run at the
#        interpreter's code's place (vb.s _ide_s0, _ide_s1 - _ide_s0 bytes):
#        LOWENT first (its entry), the code, its tables, its variables
#   B1-B8 (records 15-22): the banks at $A000 (ide/ide.h: B_VIEW ... B_LEX),
#        B10 (record 5, V149) Save program and Make application (B_MK, V99),
#        B9 (record 24) the debugger's (B_DBG, DECISIONS V97; record 23 is
#        the runtime's side of it, the main link's overlay 12),
#        each its code (BnCODE), its tables (BnRO) and what only it reads
#        (BnBSS)
#   DYN: main RAM's room for a program's names, free while the editor
#        shows: the Open and Save dialog's variables (B3BSS) after iobuf
#        (ide.h: nothing there lasts across a run)
# Zero page: buf.s's 8 bytes at $70 (the main link's ZEROPAGE ends at $6F).
# The symbols the main link has in overlay 7 (the window chrome) and its
# BSS's end: -D (tools/vbceq.py --ide).
SYMBOLS {
	__IDELOW__:   type = weak, value = $099E;       # _ide_s0
	__IDESIZE__:  type = weak, value = $4E6E;       # _ide_s1 - _ide_s0
	__IDEDYN__:   type = weak, value = $7C76;       # the main link's BSS end
	__VRWIN__:    type = weak, value = $A000;
	__VRTITLE__:  type = weak, value = $A000;
	__VRSTATUS__: type = weak, value = $A000;
}
MEMORY {
	ZPI:  file = "", define = yes, start = $0070, size = $0010;
	LOWM: file = "%O.low", define = yes, start = __IDELOW__, size = __IDESIZE__;
	DYN:  file = "", define = yes, start = __IDEDYN__ + 512, size = 688;
	B1:   file = "%O.1", define = yes, start = $A000, size = $2000;
	B2:   file = "%O.2", define = yes, start = $A000, size = $2000;
	B3:   file = "%O.3", define = yes, start = $A000, size = $2000;
	B4:   file = "%O.4", define = yes, start = $A000, size = $2000;
	B5:   file = "%O.5", define = yes, start = $A000, size = $2000;
	B6:   file = "%O.6", define = yes, start = $A000, size = $2000;
	B7:   file = "%O.7", define = yes, start = $A000, size = $2000;
	B8:   file = "%O.8", define = yes, start = $A000, size = $2000;
	B9:   file = "%O.9", define = yes, start = $A000, size = $2000;
	B10:  file = "%O.10", define = yes, start = $A000, size = $2000;
}
SEGMENTS {
	ZEROPAGE: load = ZPI, type = zp;
	LOWENT:  load = LOWM, type = ro;
	CODE:    load = LOWM, type = ro;
	RODATA:  load = LOWM, type = ro;
	DATA:    load = LOWM, type = rw;
	BSS:     load = LOWM, type = bss, define = yes;
	B3BSS:   load = DYN, type = bss, define = yes, optional = yes;
	B1CODE:  load = B1, type = ro;
	B1RO:    load = B1, type = ro, optional = yes;
	B2CODE:  load = B2, type = ro;
	B2RO:    load = B2, type = ro, optional = yes;
	B3CODE:  load = B3, type = ro;
	B3RO:    load = B3, type = ro, optional = yes;
	B4CODE:  load = B4, type = ro;
	B4RO:    load = B4, type = ro, optional = yes;
	B4BSS:   load = B4, type = bss, define = yes, optional = yes;
	B5CODE:  load = B5, type = ro;
	B5RO:    load = B5, type = ro, optional = yes;
	B5BSS:   load = B5, type = bss, define = yes, optional = yes;
	B6CODE:  load = B6, type = ro;
	B6RO:    load = B6, type = ro, optional = yes;
	B7CODE:  load = B7, type = ro;
	B7RO:    load = B7, type = ro, optional = yes;
	B8CODE:  load = B8, type = ro;
	B8RO:    load = B8, type = ro, optional = yes;
	B9CODE:  load = B9, type = ro;
	B9RO:    load = B9, type = ro, optional = yes;
	B9BSS:   load = B9, type = bss, define = yes, optional = yes;
	B10CODE: load = B10, type = ro;
	B10RO:   load = B10, type = ro, optional = yes;
	B10BSS:  load = B10, type = bss, define = yes, optional = yes;
}
