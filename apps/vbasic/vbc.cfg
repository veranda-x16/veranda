# VeraBASIC Run: the C overlays (DECISIONS V90), a link of their own after
# the main one (apps/vbasic/Makefile). Two RAM banks at $A000:
#   A (record 10): the SDK's Open and Save dialog (vrchoose.c: it fills a
#                  bank) and its entry (vbca.s)
#   B (record 11): the clipboard (scrap*.c), the tile (vrtile.c), their
#                  entries (vbcb.s, vbcb.c) and the image of LOW
# LOW: what the main program has not got of cc65's runtime, the C library
# and the SDK (the libraries' CODE, RODATA, DATA), run in main RAM at the
# console's font (2 KB, free while a box is open: vbcb.s copies it there
# before a call, the font is read from the ROM again after); BSS: the C
# parts' variables, in main RAM's scratch (vb.s sbounce .. numbuf: free
# while one runs), since the kernel reads below $A000 only. The symbols the
# main link put below $A000 come as equates (tools/vbceq.py).
SYMBOLS {
	__LOWSTART__: type = weak, value = $6941;       # (-D: _vb_font)
	__SCRSTART__: type = weak, value = $7000;       # (-D: _vb_scratch)
}
MEMORY {
	BANKA: file = "%O.a", start = $A000, size = $2000;
	BANKB: file = "%O.b", start = $A000, size = $2000;
	LOW:   file = "", define = yes, start = __LOWSTART__, size = $0800;
	SCR:   file = "", define = yes, start = __SCRSTART__, size = 808;
	SCR2:  file = "", start = __SCRSTART__, size = 808;  # (bank B's C: never with A's)
}
SEGMENTS {
	ACODE:  load = BANKA, type = ro;
	ARO:    load = BANKA, type = ro, optional = yes;
	ADATA:  load = BANKA, type = rw, optional = yes;
	BCODE:  load = BANKB, type = ro;
	BRO:    load = BANKB, type = ro, optional = yes;
	BDATA:  load = BANKB, type = rw, optional = yes;
	CODE:   load = BANKB, run = LOW, type = ro, define = yes;
	RODATA: load = BANKB, run = LOW, type = ro, optional = yes;
	DATA:   load = BANKB, run = LOW, type = rw, optional = yes;
	BBSS:   load = BANKB, type = bss, optional = yes;
	BSS:    load = SCR, type = bss, define = yes;
	BSS2:   load = SCR2, type = bss, optional = yes;
}
