# Veranda: an application in assembly (ca65). Raw bytes from $0801; pack
# them with vpack --load $0801. Everything, variables too, below $8800.
MEMORY {
	MAIN: start = $0801, size = $8800 - $0801, file = %O;
}
SEGMENTS {
	CODE:   load = MAIN, type = ro;
	RODATA: load = MAIN, type = ro;
	DATA:   load = MAIN, type = rw;
	BSS:    load = MAIN, type = bss, define = yes, optional = yes;
}
