# Veranda: an application in C (cc65, with lib/veranda.lib and cc65's
# none.lib for the runtime). Raw bytes from $0801 (pack with vpack --load
# $0801); the C stack below $8800; cc65's zero page at $A9 (GEOS's r0-r15
# at $02-$21 and the kernel's $22-$4F stay free; $80-$A8 is the X16 ROM's).
SYMBOLS {
	__STACKSIZE__:  type = weak, value = $0800;     # the C stack
	__STACKSTART__: type = weak, value = $8800;     # (its top)
	__ZPSTART__:    type = weak, value = $00A9;
}
MEMORY {
	ZP:   file = "", define = yes, start = __ZPSTART__, size = $0100 - __ZPSTART__;
	MAIN: file = %O, define = yes, start = $0801, size = __STACKSTART__ - __STACKSIZE__ - $0801;
}
SEGMENTS {
	ZEROPAGE: load = ZP,   type = zp;
	STARTUP:  load = MAIN, type = ro;
	LOWCODE:  load = MAIN, type = ro, optional = yes;
	ONCE:     load = MAIN, type = ro, optional = yes;
	CODE:     load = MAIN, type = ro;
	RODATA:   load = MAIN, type = ro;
	DATA:     load = MAIN, type = rw;
	BSS:      load = MAIN, type = bss, define = yes;
}
FEATURES {
	CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
	CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
	CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__,
	        segment = RODATA, import = __CALLIRQ__;
}
