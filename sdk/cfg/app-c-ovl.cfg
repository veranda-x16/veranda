# Veranda: an application in C with overlays that run in place in RAM
# banks (API 2; app.hdr: overlays = banked, api = 2). Record 0, the main
# program, is raw bytes from $0801 (pack with vpack --load $0801); each
# overlay n is linked at $A000 into "%O.n" (raw), from the segments
# OVERLAYn (code), OVLnRO, OVLnDATA and OVLnBSS (at most 8191 bytes with
# its BSS; the BSS is not cleared). The loader puts record n at $A000 of a
# RAM bank of its own: LoadOverlay(n, 0) gives the bank, and a store to
# ram_bank ($00) maps it (sdk/docs/GUIDE.md, "Overlays").
#
# Zero page: cc65's ZEROPAGE at $50 ($50-$7F, 48 bytes), and ZEROPAGE2 /
# ZPBSS2 at $D4-$FF (44 bytes): $A9-$D3 is left to the X16 ROM's maths
# library (bank 4: its FAC and ARG), which a program may then call.
# The C stack below $8800.
SYMBOLS {
	__STACKSIZE__:  type = weak, value = $0800;     # the C stack
	__STACKSTART__: type = weak, value = $8800;     # (its top)
	__ZPSTART__:    type = weak, value = $0050;
}
MEMORY {
	ZP:   file = "", define = yes, start = __ZPSTART__, size = $0080 - __ZPSTART__;
	ZP2:  file = "", define = yes, start = $00D4, size = $002C;
	MAIN: file = %O, define = yes, start = $0801, size = __STACKSTART__ - __STACKSIZE__ - $0801;
	OVL1: file = "%O.1", define = yes, start = $A000, size = $2000;
	OVL2: file = "%O.2", define = yes, start = $A000, size = $2000;
	OVL3: file = "%O.3", define = yes, start = $A000, size = $2000;
	OVL4: file = "%O.4", define = yes, start = $A000, size = $2000;
	OVL5: file = "%O.5", define = yes, start = $A000, size = $2000;
