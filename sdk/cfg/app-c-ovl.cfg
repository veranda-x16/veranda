	OVL7: file = "%O.7", define = yes, start = $A000, size = $2000;
	OVL8: file = "%O.8", define = yes, start = $A000, size = $2000;
	OVL9: file = "%O.9", define = yes, start = $A000, size = $2000;
	OVL10: file = "%O.10", define = yes, start = $A000, size = $2000;
	OVL11: file = "%O.11", define = yes, start = $A000, size = $2000;
	OVL12: file = "%O.12", define = yes, start = $A000, size = $2000;
	OVL13: file = "%O.13", define = yes, start = $A000, size = $2000;
	OVL14: file = "%O.14", define = yes, start = $A000, size = $2000;
	OVL15: file = "%O.15", define = yes, start = $A000, size = $2000;
	OVL16: file = "%O.16", define = yes, start = $A000, size = $2000;
	OVL17: file = "%O.17", define = yes, start = $A000, size = $2000;
	OVL18: file = "%O.18", define = yes, start = $A000, size = $2000;
	OVL19: file = "%O.19", define = yes, start = $A000, size = $2000;
	OVL20: file = "%O.20", define = yes, start = $A000, size = $2000;
	OVL21: file = "%O.21", define = yes, start = $A000, size = $2000;
	OVL22: file = "%O.22", define = yes, start = $A000, size = $2000;
	OVL23: file = "%O.23", define = yes, start = $A000, size = $2000;
	OVL24: file = "%O.24", define = yes, start = $A000, size = $2000;
}
