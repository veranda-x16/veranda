# gate spec: the jump tables at their addresses
MEMORY {
	CLASSIC: start = $8800, size = $0200, fill = yes, file = %O;
	NEW:     start = $8A00, size = $0400, file = %O;
	STUBS:   start = $9000, size = $0100, file = "";
}
SEGMENTS {
	JUMPTAB:  load = CLASSIC, type = ro;
	JUMPTAB2: load = NEW, type = ro;
	CODE:     load = STUBS, type = ro;
}
