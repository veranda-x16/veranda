# Veranda: one kernel bank at $A000 (tools/kbuild.py); 8 KB with its variables
MEMORY {
	BANK: start = $A000, size = $2000, fill = yes, file = %O;
}
SEGMENTS {
	ENTRY:  load = BANK, type = ro;
	CODE:   load = BANK, type = ro;
	RODATA: load = BANK, type = ro;
	PAGED:  load = BANK, type = ro, optional = yes, align = $100;   # bank T's UI font (V62)
	DATA:   load = BANK, type = rw;
	BSS:    load = BANK, type = bss, optional = yes;
	LATE:   load = BANK, type = ro, optional = yes;    # bank G: code kept out of text's way (V62)
	RBIMG:  load = BANK, type = ro, optional = yes, start = $BC00;   # bank T: the way back from BASIC (V64)
	TAIL:   load = BANK, type = ro, optional = yes;     # bank T: code after RBIMG (V81)
}
