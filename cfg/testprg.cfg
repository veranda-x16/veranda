# Veranda: a test program as a plain .PRG at $0801, entry at its first byte
# (phase 1-4 gates; applications get the loader in phase 5)
MEMORY {
	HDR:  start = $07FF, size = 2, file = %O;
	MAIN: start = $0801, size = $7FFF, file = %O;
}
SEGMENTS {
	LOADADDR: load = HDR, type = ro;
	CODE:     load = MAIN, type = ro;
	RODATA:   load = MAIN, type = ro;
	DATA:     load = MAIN, type = rw;
	BSS:      load = MAIN, type = bss, optional = yes;
}
