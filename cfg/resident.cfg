# Veranda: the resident core, $8800-$9EFF (tools/kbuild.py)
MEMORY {
	JT:   start = $8800, size = $0200, fill = yes, file = %O;
	REST: start = $8A00, size = $1500, file = %O;
}
SEGMENTS {
	JUMPTAB:  load = JT, type = ro;
	JUMPTAB2: load = REST, type = ro;
	CODE:     load = REST, type = ro;
	RODATA:   load = REST, type = ro;
	DATA:     load = REST, type = rw;
	BSS:      load = REST, type = bss, optional = yes;
}
