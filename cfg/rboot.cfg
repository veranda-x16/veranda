# Veranda: RBOOT (loader/rboot.s); LOW is copied to $0700 for the
# card's fallback (VERANDA.PRG loads over RBOOT at $0801)
MEMORY {
	HDR:  start = $07FF, size = 2, file = %O;
	MAIN: start = $0801, size = $0600, file = %O;
	LO:   start = $0700, size = $0100, file = "";
}
SEGMENTS {
	LOADADDR: load = HDR, type = ro;
	STUB:     load = MAIN, type = ro;
	CODE:     load = MAIN, type = ro;
	LOW:      load = MAIN, run = LO, type = ro, define = yes;
}
